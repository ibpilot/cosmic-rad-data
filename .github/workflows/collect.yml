name: collect

on:
  schedule:
    # Cada 6 horas. SWPC rota a 7 dias: cada corrida recupera huecos dentro
    # de la ventana y archiva los dias UTC completos.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  # Cancelar una corrida en curso pierde su captura SWPC: se encola, no se cancela.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Solo este job escribe: commitea solar/, ncei/ y manifest.json.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pin S2)
        with:
          # El token no se guarda en .git/config: el codigo de terceros (h5py,
          # numpy, libhdf5 leyendo NetCDF de NCEI) no lo puede leer. Se inyecta
          # solo en los pasos de push.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (pin S2)
        with:
          python-version: "3.12"

      - name: Run collector
        # Solo stdlib: no instala nada de terceros.
        run: python3 collect.py .

      - name: Commit y push SWPC (antes de ejecutar codigo de terceros)
        # La captura SWPC es la irreversible (ventana de 7 dias): se publica ya,
        # asi un cuelgue o fallo del paso NCEI no la puede perder.
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.name "cosmic-rad-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- solar manifest.json
          if git diff --cached --quiet; then
            echo "Sin cambios en solar/ ni manifest.json."
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "colector: actualizar archivo solar"
          for i in 1 2 3; do
            git -c core.hooksPath=/dev/null pull --rebase origin main && \
            git -c core.hooksPath=/dev/null push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: NCEI catch-up (incremental y acotado)
        # Extiende ncei/ desde el dia siguiente al ultimo importado hasta el
        # ultimo que NCEI ya deberia haber publicado (hoy - latencia). Es
        # idempotente y reanudable. Corre SIN token. El timeout de paso (no el
        # del job) con continue-on-error deja seguir al job si NCEI se cuelga;
        # backfill_ncei.py ademas se corta solo por presupuesto de tiempo.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python3 -m pip install --quiet --require-hashes -r requirements-ncei.txt
          python3 backfill_ncei.py . --catch-up --satellites g18,g19

      - name: Commit y push NCEI (solo JSON bajo ncei/)
        env:
          TOKEN: ${{ github.token }}
        run: |
          # El paso anterior ejecuto codigo de terceros: cualquier cambio fuera
          # de ncei/*.json (p. ej. un .html plantado, que Pages serviria en el
          # origen de la app) aborta sin publicar nada.
          if git status --porcelain --untracked-files=all | grep -vE '^(\?\?| M) ncei/[A-Za-z0-9_./-]+\.json$'; then
            echo "::error::cambios inesperados fuera de ncei/*.json; no se publica"
            exit 1
          fi
          git add -- ncei
          if git diff --cached --quiet; then
            echo "Sin cambios en ncei/."
            exit 0
          fi
          # hooksPath=/dev/null: un hook plantado en .git/hooks no se ejecuta
          # con el token en el entorno.
          git -c core.hooksPath=/dev/null commit -m "colector: actualizar NCEI"
          for i in 1 2 3; do
            git -c core.hooksPath=/dev/null pull --rebase origin main && \
            git -c core.hooksPath=/dev/null push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
