name: collect

on:
  schedule:
    # Cada 6 horas. SWPC rota a 7 dias: cada corrida recupera huecos dentro
    # de la ventana y archiva los dias UTC completos.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  # El bot necesita escribir en el repo para commitear solar/ y manifest.json.
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pin S2)
        # Sin persist-credentials: false: el push del bot usa el GITHUB_TOKEN
        # por defecto, que ya tiene permiso de escritura (contents: write).

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (pin S2)
        with:
          python-version: "3.12"

      - name: Run collector
        run: python3 collect.py .

      - name: Commit and push
        run: |
          git config user.name "cosmic-rad-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A: en la primera corrida solar/ puede no existir todavia y un
          # 'git add solar' con pathspec inexistente aborta el job.
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en solar/ ni manifest.json; no hay commit."
          else
            git commit -m "colector: actualizar archivo solar y manifest"
            git push
          fi
